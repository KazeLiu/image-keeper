[package]
name = "imagekeeper"
version = "0.1.0"
description = "二次元原图库整理工具"
authors = ["ImageKeeper"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rayon = "1.8"
image = "0.24"
fast_image_resize = "3.0"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.4"
dirs = "5.0"
base64 = "0.21"
uuid = { version = "1.23.5", features = ["v4"] }
csv = "1.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.27.0"

# SSIM 内核是纯标量浮点热路径，需要跨 crate 内联才能拿到 image / fast_image_resize 的优化。
# 不设 panic = "abort"：Tauri command 依赖 unwind 把单个分组的 panic 转成错误返回。
[profile.release]
lto = "fat"
codegen-units = 1

# 开发态跑真实图片时避免依赖库退化到无优化，否则 SSIM 调试基本不可用。
[profile.dev.package."*"]
opt-level = 2
